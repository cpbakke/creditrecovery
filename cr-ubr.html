<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credit Recovery Dashboard (Prototype, synthetic data)</title>
<style>
/* APS brand colors: PLACEHOLDERS until official hex codes arrive. Swap these three. */
:root{
  --aps-purple:#4B2E83;
  --aps-orange:#F2A900;
  --aps-teal:#00877C;

  --st-rec:#00877C;      /* Recovered (teal) */
  --st-ip:#8CCBC4;       /* In progress (light teal) */
  --st-part:#F6D27F;     /* Partial credit (light orange) */
  --st-ns:#E08A00;       /* Not scheduled (orange) */
  --neutral:#BAB0AC;
  --red:#C8102E;          /* Nothing scheduled on the one-pager */

  --page:#E9E9EB; --canvas:#FFFFFF; --text:#2B2B2B; --muted:#5F5F66;
  --grid:#E3E3E6; --grid-strong:#C4C4CA; --hdr:#F4F4F6; --band:#FAFAFB; --hover:#EEEAF6; --tab:#DADADE;
  --font:"Tableau Book","Benton Sans","Segoe UI","Helvetica Neue",Helvetica,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#1C1C1F; --canvas:#26262A; --text:#ECECEE; --muted:#A9A9B2;
    --grid:#3A3A40; --grid-strong:#55555D; --hdr:#2F2F34; --band:#2A2A2E; --hover:#3A3348; --tab:#34343A;
  }
}
:root[data-theme="dark"]{
  --page:#1C1C1F; --canvas:#26262A; --text:#ECECEE; --muted:#A9A9B2;
  --grid:#3A3A40; --grid-strong:#55555D; --hdr:#2F2F34; --band:#2A2A2E; --hover:#3A3348; --tab:#34343A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--text);font:13px/1.35 var(--font)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--aps-orange);outline-offset:1px}

.proto{background:#FCE9B8;color:#3A2A00;padding:6px 16px;font-size:12px}
.server{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--canvas);border-bottom:1px solid var(--grid);flex-wrap:wrap}
.server .wb{font-weight:600}
.server .crumb{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;padding:8px 16px 0;overflow-x:auto}
.tab{border:1px solid var(--grid-strong);border-bottom:none;background:var(--tab);padding:7px 14px;cursor:pointer;border-radius:3px 3px 0 0;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--canvas);font-weight:600;box-shadow:inset 0 3px 0 var(--aps-purple)}
.stage{overflow-x:auto;padding:0 16px 24px}
.dash{width:1366px;min-height:768px;background:var(--canvas);border:1px solid var(--grid-strong);position:relative}
.banner{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--aps-purple);color:#fff;padding:0 16px;height:56px}
.banner h1{font-size:18px;margin:0;font-weight:600}
.banner .sub{font-size:12px;opacity:.92;margin-top:2px}
.banner .right{display:flex;align-items:center;gap:10px}
.bbtn{background:transparent;border:1px solid rgba(255,255,255,.7);color:#fff;padding:5px 11px;border-radius:3px;cursor:pointer}
.bbtn.reset{background:var(--aps-orange);border-color:var(--aps-orange);color:#2A1D00;font-weight:600}
.body{display:flex;align-items:stretch}
.main{flex:1;min-width:0;padding:10px 16px 16px}
.pane{width:232px;flex:none;border-left:1px solid var(--grid);padding:12px 12px 16px}

.ws-title{font-weight:600;font-size:13px;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ws-title .note{font-weight:400;color:var(--muted);font-size:11.5px}
.ws-title:first-child{margin-top:4px}
.cols{display:grid;gap:16px}

.bans{display:grid;border:1px solid var(--grid)}
.ban{padding:10px 14px;border-right:1px solid var(--grid);min-width:0}
.ban:last-child{border-right:none}
.ban .l{font-size:12px;color:var(--muted);min-height:32px}
.ban .v{font-size:30px;font-weight:600;color:var(--aps-purple);line-height:1.15;font-variant-numeric:tabular-nums}
.ban .v.ph{color:var(--neutral)}
.ban .s{font-size:11.5px;color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ban .v{color:#C9B8EC}}
:root[data-theme="dark"] .ban .v{color:#C9B8EC}

.scroll{overflow:auto;border:1px solid var(--grid)}
.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
.tbl th{font-weight:600;text-align:left;padding:5px 6px;border-bottom:1px solid var(--grid-strong);background:var(--hdr);position:sticky;top:0;z-index:1;vertical-align:bottom;white-space:normal;line-height:1.2}
.tbl th.num{text-align:right}
.tbl th.sortable{cursor:pointer}
.tbl th .arr{color:var(--muted);font-weight:400;margin-left:3px}
.tbl td{padding:4px 6px;border-bottom:1px solid var(--grid);white-space:nowrap}
.tbl tbody tr:nth-child(even) td{background:var(--band)}
.tbl tr.click{cursor:pointer}
.tbl tr.total td{font-weight:600;border-top:1px solid var(--grid-strong);background:var(--hdr)}
.tbl td.cell{cursor:pointer;text-align:right}
.tbl td.cell.sel{outline:2px solid var(--aps-purple);outline-offset:-2px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.ph{color:var(--neutral);font-style:italic}
.sq{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.warn{color:#9A5B00;font-weight:600}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .warn{color:#F5B94A}}
:root[data-theme="dark"] .warn{color:#F5B94A}

.bars{border:1px solid var(--grid);padding:6px 10px}
.brow{display:grid;grid-template-columns:150px 1fr 60px;align-items:center;gap:8px;min-height:22px}
.brow .lab{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack{display:flex;height:16px;background:var(--hdr)}
.seg{height:100%;font-size:10.5px;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.hbar{height:14px;background:var(--aps-purple)}
.axis{display:grid;grid-template-columns:150px 1fr 60px;gap:8px;font-size:10.5px;color:var(--muted);margin-top:2px}
.axis .ticks{display:flex;justify-content:space-between}

.fcard{margin-bottom:12px}
.ftitle{display:block;font-weight:600;font-size:12px;margin-bottom:3px}
.fcard select{width:100%;padding:4px;border:1px solid var(--grid-strong);background:var(--canvas);border-radius:2px}
.fcard .opt{display:flex;align-items:center;gap:6px;font-size:12px;padding:1px 0}
.fcard .opt input{margin:0}
.pane hr{border:none;border-top:1px solid var(--grid);margin:12px 0}
.legend .row{display:flex;align-items:center;font-size:12px;padding:2px 0}
.pnote{font-size:11.5px;color:var(--muted)}

.tip,.menu{position:fixed;z-index:60;background:var(--canvas);color:var(--text);border:1px solid var(--grid-strong);box-shadow:0 2px 8px rgba(0,0,0,.2);padding:8px 10px;font-size:12px;max-width:360px}
.tip{pointer-events:none;display:none}
.tip .ln,.menu .ln{padding:1px 0}
.tip .ln span,.menu .ln span{color:var(--muted)}
.menu{display:none}
.menu .acts{border-top:1px solid var(--grid);margin-top:6px;padding-top:6px;display:flex;flex-direction:column;gap:3px}
.menu .acts button{background:none;border:none;padding:2px 0;text-align:left;color:#2F5FAD;text-decoration:underline;cursor:pointer}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .menu .acts button{color:#8EB4F0}}
:root[data-theme="dark"] .menu .acts button{color:#8EB4F0}

.info{position:absolute;top:62px;right:244px;width:700px;background:var(--canvas);border:1px solid var(--grid-strong);box-shadow:0 4px 14px rgba(0,0,0,.22);padding:14px 16px;z-index:30;display:grid;grid-template-columns:1fr 1fr;gap:18px;font-size:12.5px}
.info h2{font-size:13px;margin:0 0 6px}
.info p,.info li{margin:0 0 6px}
.info ul{padding-left:16px;margin:0}
.info .close{position:absolute;top:6px;right:8px;background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted)}
.tbl.pager td.qc,.tbl.pager th.qc{text-align:center;width:38px}
.tbl tr.grp td{background:var(--hdr)!important;border-top:1px solid var(--grid-strong);padding-top:6px}
.tbl td.mk{color:#1A1A1A}
.tbl td.rh{vertical-align:top;font-weight:600;background:var(--canvas)!important;border-right:1px solid var(--grid)}
.tbl tr.sub td{border-top:1px solid var(--grid-strong);font-weight:600}
.empty{padding:18px;color:var(--muted);text-align:center}
.cap{font-size:11.5px;color:var(--muted);margin-top:4px}
</style>
</head>

<script>
"use strict";
/* Version switch: false = Version 1 (CR + UBR), true = Version 2 (CR only: no Student F List, no UBR tab, no UBR KPIs) */
const CR_ONLY=false;
/* ============================ Synthetic data ============================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261001);
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wpick(arr){let t=0;for(const a of arr)t+=a.w;let r=R()*t;for(const a of arr){r-=a.w;if(r<=0)return a}return arr[arr.length-1]}

const LAST=['Abara','Acosta','Adeyemi','Aguilar','Ahmed','Alvarez','Banda','Barrera','Bui','Campos','Castillo','Chavez','Cruz','Delgado','Diallo','Dominguez','Espinoza','Estrada','Flores','Fuentes','Garcia','Gomez','Gutierrez','Haile','Hassan','Herrera','Huynh','Ibarra','Jimenez','Johnson','Kamara','Kim','Lopez','Luna','Martinez','Medina','Mendoza','Mohamud','Morales','Nguyen','Nunez','Okafor','Ortega','Ortiz','Pacheco','Perez','Pham','Ramirez','Reyes','Rios','Rivera','Robinson','Rodriguez','Romero','Salazar','Sanchez','Santos','Silva','Soto','Tesfaye','Torres','Tran','Valdez','Vargas','Vasquez','Walker','Warsame','Williams','Yohannes','Zamora'];
const STAFF_LAST=['Abbott','Bennett','Calloway','Dorsey','Ellison','Fairbanks','Greer','Hollis','Ingram','Jarvis','Keller','Lindqvist','Maddox','Navarro','Oakley','Prescott','Quintero','Rasmussen','Sutton','Thornton','Underwood','Vance','Whitlock','Yardley','Zeller','Archer','Brandt','Corwin','Delacroix','Emerson','Fontaine','Galloway','Hargrove','Ishikawa','Jessup','Kowalski','Larkin','Merritt','Nolan','Osei','Pruitt','Redd','Sato','Tillman','Upton','Voss','Winslow','Yoon'];

/* School totals calibrated to discovery (10/1/2026). n = current students (9,239 total).
   fStu = students with >=1 CR-eligible F (2,521). lab/cr = Edgenuity Lab / CreditRec students (CR Dashboard sheet).
   ip = OCR F's in progress. ubr = failing UBR-eligible courses (Wk 7). orph = tab records with no transcript F.
   ocrY = OCR completions this year. */
const SCHOOLS=[
 {id:123,name:'APS Avenues Alternative Education Campus',short:'APS Avenues',n:234,fStu:140,lab:71,cr:77,ocr:true,ip:118,ubr:31,orph:22,ocrY:9},

 {id:40,name:'Aurora West College Preparatory Academy',short:'Aurora West',n:402,fStu:95,lab:0,cr:0,ocr:false,ip:0,ubr:50,orph:0,ocrY:0},
 {id:42,name:'Gateway High School',short:'Gateway',n:1472,fStu:430,lab:335,cr:327,ocr:true,ip:575,ubr:179,orph:454,ocrY:31},
 {id:43,name:'Hinkley High School',short:'Hinkley',n:1194,fStu:330,lab:72,cr:76,ocr:true,ip:110,ubr:104,orph:73,ocrY:22},
 {id:52,name:'Lotus School for Excellence',short:'Lotus',n:355,fStu:40,lab:0,cr:0,ocr:false,ip:0,ubr:12,orph:1,ocrY:0},
 {id:44,name:'Rangeview High School',short:'Rangeview',n:1820,fStu:395,lab:100,cr:131,ocr:true,ip:259,ubr:249,orph:241,ocrY:37},
 {id:85,name:'Vanguard Classical School - East',short:'Vanguard East',n:216,fStu:20,lab:0,cr:0,ocr:false,ip:0,ubr:6,orph:0,ocrY:0},
 {id:73,name:'Vista PEAK Preparatory',short:'Vista PEAK',n:2103,fStu:526,lab:347,cr:308,ocr:true,ip:640,ubr:216,orph:489,ocrY:68}
];

/* CR-eligible courses (CR tab dropdown). [name, OCR code, weight, slot (HS year usually taken), credit, regular-code override] */
const COURSE_DEF=[
 ['English 9','HLAOCR1012',10,1,1],['English 10','HLAOCR1042',10,2,1],['English 11','HLAOCR3122',9,3,1],['English 12','HLAOCR4102',3,3,1],
 ['Integrated Math 1','HMAOCR1010',10,1,1],['Integrated Math 2','HMAOCR1013',9,2,1],['Integrated Math 3','HMAOCR1014',7,3,1],['Integrated Math 4',null,.6,3,1,'HMA1015'],
 ['Algebra 1','HMAOCR1091',1.5,1,1],['Algebra II','HMAOCR1026',1.5,3,1],['Geometry','HMAOCR1070',1.5,2,1],['Financial Algebra','HMAOCR5070',1.5,3,1],
 ['Probability and Statistics','HMAOCR1040',1,3,1],['CPM Precalculus','HMAOCR1016',1,3,1],['Math Analysis','HMAOCR2035',.5,3,1],['Mathematical Modeling','HMAOCR5080',.5,3,1],
 ['Biology','HSCOCR1042',8,1,1],['Chemistry','HSCOCR2012',6,2,1],['Physics','HSCOCR4012',6,3,1],['Earth Science','HSCOCR1011',2,1,1],
 ['Physical Science','HSCOCR3012',2,1,1],['Environmental Science','HSCOCR5021',1.5,3,1],
 ['US History','HSSOCR3012',7,2,1],['Global Studies','HSSOCR1011',7,1,1],['World History','HSSOCR1012',3,2,1],['Civics','HSSOCR1021',6,3,.5],
 ['Economics','HSSOCR1013',2,3,.5],['Financial Literacy','HSSOCR1045',1.5,3,.5],['Psychology','HSSOCR5092',1,3,.5],['Sociology','HSSOCR1225',.7,3,.5],
 ['Latin American History','HSSOCR1050',.5,3,.5],['African-American Studies','HSSOCR5062',.5,3,.5],
 ['Spanish 1','HFLOCR5012',2.5,1,1],['Spanish 2','HFLOCR5025',2,2,1],['Spanish 3','HFLOCR5032',.7,3,1],['French 1','HFLOCR1012',.5,2,1],
 ['French 2',null,.3,3,1,'HFL1025'],['Chinese 1','HFLOCR3046',.3,2,1],
 ['Art Elective I','HAROCR1012',1.5,1,.5],['Art Elective II','HAROCR1013',.8,2,.5],['Physical Education','HPEOCR1011',2.5,1,.5],
 ['Health & Activity for Life','HPEOCR1015',1.5,2,.5],['Health','HHEOCR1011',2,1,.5]
];
const SUBJ={LA:'English',MA:'Math',SC:'Science',SS:'Social Studies',FL:'World Language',AR:'Art',PE:'Physical Education',HE:'Health'};
const COURSES=COURSE_DEF.map(([name,ocr,w,slot,needed,reg])=>{const r=reg||ocr.replace('OCR','');return {name,ocr,w,slot,needed,reg:r,subj:SUBJ[r.slice(1,3)]}});

const usedStaff=new Set();
function staff(){let n;do{n=pick(STAFF_LAST)+', '+pick(STAFF_FIRST)}while(usedStaff.has(n));usedStaff.add(n);return n}
function emailOf(name,dom,suffix){const [l,f]=name.split(', ');return (f+'.'+l).toLowerCase().replace(/[^a-z.]/g,'')+(suffix||'')+'@'+dom}
const yl=y=>`${y-1}-${String(y).slice(2)}`;
const fmtC=x=>x.toFixed(2);

const SMAP={recOCR:['Recovered','OCR'],summer:['Recovered','Summer'],retake:['Recovered','Retake'],same:['Recovered','Same-year credit'],transfer:['Recovered','Transfer'],
  ipOCR:['In progress','OCR'],ipRetake:['In progress','Retake'],partial:['Partial credit',null],ns:['Not scheduled',null]};
function setStatus(f,k){
  const [g,route]=SMAP[k];f.k=k;f.group=g;f.route=route;
  f.status=route?`${g}: ${route}`:g;
  f.earned=g==='Recovered'?f.needed:k==='partial'?f.orig+0.25*ri(1,f.nf-1):f.orig;
  if(g==='Recovered'){f.recYear=k==='recOCR'?ri(f.fYear,2026):k==='retake'?ri(f.fYear+1,2026):f.fYear}
  f.sched=k==='ipOCR'?'OCR in CreditRec':k==='ipRetake'?'Retake':'None';
}
function drawStatus(sc,f){
  const p=sc.ocr?{recOCR:.093,summer:.0015,retake:.165,same:.0195,transfer:.006,ipRetake:0,partial:.076}
               :{recOCR:.03,summer:.003,retake:.15,same:.03,transfer:.008,ipRetake:.01,partial:.06};
  let r=R(),k='ns';
  for(const key in p){r-=p[key];if(r<0){k=key;break}}
  if(k==='recOCR'&&!f.c.ocr)k='retake';
  if(k==='retake'&&f.fYear>=2026)k=R()<.3?'ipRetake':'ns';
  if(k==='partial'&&f.nf<2)k='ns';
  return k;
}
function genFs(s,sc,ipMean){
  const g=+s.grade,yb=g-9,startY=2027-yb;
  let k=0;if(s.cr)k=Math.max(1,Math.min(4,Math.round(ipMean+(R()-0.5)*1.6)));
  let n=1+Math.floor(-Math.log(1-R())*3.4);n=Math.min(n,12);n=Math.max(n,k);
  const avail=COURSES.filter(c=>c.slot<=yb),used=new Set();
  for(let i=0;i<n;i++){
    const pool=avail.filter(c=>!used.has(c.name));if(!pool.length)break;
    const c=wpick(pool);used.add(c.name);
    let fy=startY+c.slot-1;if(fy<2026&&R()<.15)fy++;
    let nf;if(c.needed===0.5)nf=R()<.6?1:2;else{const r=R();nf=r<.35?1:r<.65?2:r<.8?3:4}
    const q0=c.needed===0.5?(R()<.5?1:3)+(nf===1&&R()<.5?1:0):1+Math.floor(R()*(4-nf+1));
    s.fs.push({s,c,fYear:fy,fQ:'Q'+q0,needed:c.needed,orig:c.needed-0.25*nf,nf});
  }
  if(k)shuffle(s.fs.filter(f=>f.c.ocr)).slice(0,k).forEach(f=>setStatus(f,'ipOCR'));
  for(const f of s.fs)if(!f.k)setStatus(f,drawStatus(sc,f));
}
function setTab(f){
  const r=R();
  if(f.group==='Recovered')f.tab=r<.607?'Yes':r<.663?'No':'None';
  else if(f.group==='In progress')f.tab=r<.08?'Yes':r<.60?'No':'None';
  else f.tab=r<.034?'Yes':r<.273?'No':'None';
  if(f.tab!=='None'){
    if(f.group==='In progress')f.tabYear=R()<.7?2027:ri(f.fYear,2026);
    else if(f.group==='Recovered')f.tabYear=ri(f.fYear,Math.max(f.fYear,f.recYear));
    else f.tabYear=(f.tab==='No'&&R()<.26)?2027:ri(f.fYear,2026);
  }
}
function nextStep(f){
  if(f.group==='Recovered'){
    if(f.route==='Transfer')return 'Verify transfer';
    if(f.tab==='None')return 'Enter CR tab record (Yes)';
    if(f.tab==='No')return 'Mark CR tab Yes';
    return 'None';
  }
  if(f.group==='In progress')return f.tab==='None'?'Enter CR tab record':'Monitor progress';
  const sched=f.c.ocr?'Schedule OCR':'Schedule retake';
  return f.tab==='None'?sched+' + enter CR tab record':sched;
}

const UBR_EXTRA=[

const R2=mulberry32(4242);
const r2i=(a,b)=>a+Math.floor(R2()*(b-a+1));
const p2=a=>a[Math.floor(R2()*a.length)];

function creditType(name,code){

  if(pre==='HSS'){if(WS_NAMES.includes(nm))return 'World Studies';if(USH_NAMES.includes(nm))return 'U.S. History';if(CIV_NAMES.includes(nm))return 'Civics';return 'Social Science'}
  if(pre==='HFL')return 'World Language';

const REQ_ORDER=['Language Arts','Mathematics','Science','World Studies','U.S. History','Civics','Social Science','World Language','Computer Tech','Fine Arts','Physical Education','Health','Elective'];

const BASE={9:{eng:'English 9',math:'Integrated Math 1',sci:'Biology',ss:'Global Studies',wl:'Spanish 1',pair:['Physical Education','Health']},
 10:{eng:'English 10',math:'Integrated Math 2',sci:'Chemistry',ss:'US History',wl:'Spanish 2',pair:['Art Elective I','Health & Activity for Life']},

const LET=(strong)=>{const r=R2();return strong?(r<.3?'A':r<.65?'B':r<.9?'C':'D'):(r<.08?'A':r<.3?'B':r<.7?'C':'D')};
function qPositions(needed,q0){ /* quarters the course runs in */
  if(needed===1)return [1,2,3,4];

}
function buildTranscript(s){
  const rows=[];if(s.grade==='09')return rows;
  const g=+s.grade,yb=g-9,startY=2027-yb,strong=!s.fs.length;
  const fByName=Object.fromEntries(s.fs.map(f=>[f.c.name,f]));
  let tookSpanish=false;
  for(let y=startY;y<=2026;y++){
    const gl=9+(y-startY),b=BASE[gl];
    const list=[];
    const addReq=nm=>{const f=fByName[nm];if(f&&f.fYear!==y)return false;list.push(nm);return true};
    addReq(b.eng);addReq(b.math);if(b.sci)addReq(b.sci);if(b.ss)addReq(b.ss);
    const vista=s.sc.id===73;
    if(gl===9){if(R2()<(vista?.55:.3)){addReq('Spanish 1');tookSpanish=true}}
    else if(gl===10){if(R2()<.85){addReq(tookSpanish?'Spanish 2':'Spanish 1');tookSpanish=true}}
    else if(gl===11&&tookSpanish&&R2()<(vista?.8:.3))addReq('Spanish 3');
    for(const nm of b.pair)addReq(nm==='SS_SEM'?(s.ssSem=s.ssSem||p2(SS_SEM)):nm);
    for(const f of s.fs)if(f.fYear===y&&!list.includes(f.c.name))list.push(f.c.name);
    let slots=list.reduce((t,nm)=>t+(COURSE_BY_NAME[nm].needed===1?1:.5),0);
    const target=R2()<.08?6:7;const usedE=new Set();
    while(slots<target){const e=p2(ELECTIVES);if(usedE.has(e[0]))continue;usedE.add(e[0]);list.push(e);slots++}
    for(const item of list){
      if(Array.isArray(item)){ /* non-required elective */
        const qs=[1,2,3,4].map(()=>R2()<(strong?.01:.07)?'F':LET(strong));
        rows.push({y,ylab:yl(y),name:item[0],code:item[1],type:creditType(item[0],item[1]),needed:1,qs,earned:.25*qs.filter(q=>q!=='F').length,elective:true});
        continue;
      }
      const c=COURSE_BY_NAME[item],f=fByName[item]&&fByName[item].fYear===y?fByName[item]:null;
      const q0=f?+f.fQ.slice(1):(c.needed===1?1:(list.indexOf(item)%2?3:1));
      const pos=qPositions(c.needed,q0);const qs=[null,null,null,null];
      for(const q of pos)qs[q-1]=LET(strong);
      if(f){for(let i=0;i<f.nf;i++){const q=q0+i;if(pos.includes(q))qs[q-1]='F'}}
      const earned=.25*qs.filter(q=>q&&q!=='F').length;let other='';
      /* Synthetic posting styles, mirroring TranscriptCourse.gradingTaskCode: most courses post Q1–Q4; some post S1/S2 or one Final */
      if(!f){
        const lotus=s.sc.id===52,vista=s.sc.id===73;
        if(c.needed===1&&vista&&R2()<.3){other=`Final: ${qs[3]}`;qs.fill(null)}
        else if(c.needed===1&&lotus&&R2()<.5){other=`S1: ${qs[1]}, S2: ${qs[3]}`;qs.fill(null)}
        else if(c.needed===.5&&(lotus||R2()<.2)){const q=qs.findIndex(x=>x);other=`${q<2?'S1':'S2'}: ${qs[q+1]||qs[q]}`;qs.fill(null)}
      }
      rows.push({y,ylab:yl(y),name:c.name,code:c.reg,type:creditType(c.name,c.reg),needed:c.needed,qs,earned,f,other});
    }
  }
  /* recovery rows */
  for(const f of s.fs){
    const failed=[];const q0=+f.fQ.slice(1);for(let i=0;i<f.nf;i++)failed.push(q0+i);
    const mk=(y,ylab,code,name,credit,sort)=>{const qs=[null,null,null,null];let left=credit;for(const q of failed){if(left<=0)break;qs[q-1]=LET(false)==='D'?'C':LET(false);left-=.25}
      rows.push({y:sort||y,ylab,name,code,type:creditType(f.c.name,f.c.reg),needed:f.needed,qs,earned:credit,rec:f})};
    const owed=f.needed-f.orig;
    if(f.k==='recOCR')mk(f.recYear,yl(f.recYear),f.c.ocr,f.c.name,owed);
    else if(f.k==='summer')mk(f.fYear,'Summer '+f.fYear,f.c.reg+'SM',f.c.name,owed,f.fYear+.5);
    else if(f.k==='retake')mk(f.recYear,yl(f.recYear),f.c.reg,f.c.name,owed);
    else if(f.k==='transfer'){mk(f.fYear,yl(f.fYear),'HTR'+f.c.reg.slice(3),f.c.name+' (transfer)',owed,f.fYear+.6);const tr=rows[rows.length-1];tr.qs=[null,null,null,null];tr.other='Transfer: '+p2(TRANSFER_SCHOOLS)+' (P)'}
    else if(f.k==='partial'){f.partYear=r2i(f.fYear,2026);mk(f.partYear,yl(f.partYear),f.c.ocr||f.c.reg,f.c.name,f.earned-f.orig)}
  }
  rows.sort((a,b)=>a.y-b.y||(a.rec?1:0)-(b.rec?1:0)||a.name.localeCompare(b.name));
  return rows;
}

  if(s.assigned!==s.prog)s.audit.push({chk:'C',s,course:'Graduation program',code:'',detail:`Assigned: ${PROGRAMS[s.assigned].name}. Expected for the ${s.grade==='12'?'Class of 2027':'Class of 2028 & beyond'}: ${PROGRAMS[s.prog].name}`});
  s.tx=buildTranscript(s);
  s.sched=buildSchedule(s);
  s.openF=s.fs.filter(f=>f.group!=='Recovered').length;
  if(s.grade==='09'){s.onTrack=true;s.otElig=false;s.credStart=0;s.credNow=0;continue}
  s.otElig=true;
  s.credStart=s.tx.filter(r=>r.y<2027).reduce((t,r)=>t+r.earned,0);
  s.credNow=s.tx.reduce((t,r)=>t+r.earned,0);
  s.expected=paceVal(s,'Total',CUR_Q);
  s.onTrack=s.credNow>=s.expected;
  s.startedOff=s.credStart<s.expected;
}

function metrics(list){
  const m={stu:list.length,fStu:0,addr:0,f:0,fAddr:0,rec:0,ip:0,partial:0,ns:0,notAddr:0,ocrY:0,
    lab:0,cr:0,labOnly:0,crOnly:0,audit:0,ubrStu:0,ubrC:0,tabOpen:0,tabSched:0,otElig:0,ot:0,startOff:0,backOn:0,stillOff:0,noTab:0,openStu:0};
  for(const s of list){
    if(s.fs.length){
      m.fStu++;let all=true;
      for(const f of s.fs){
        m.f++;
        if(f.group==='Recovered'){m.rec++;m.fAddr++;if(f.route==='OCR'&&f.recYear===2027)m.ocrY++}
        else if(f.group==='In progress'){m.ip++;m.fAddr++}
        else{all=false;m.notAddr++;if(f.group==='Partial credit')m.partial++;else m.ns++}
        if(f.tab==='No'&&f.tabYear===2027&&f.group!=='Recovered'){m.tabOpen++;if(f.sched==='OCR in CreditRec')m.tabSched++}
        if(f.group!=='Recovered'&&f.tab==='None')m.noTab++;
      }
      if(all)m.addr++;else m.openStu++;
    }
    if(s.lab)m.lab++;if(s.cr)m.cr++;if(s.lab&&!s.cr)m.labOnly++;if(s.cr&&!s.lab)m.crOnly++;
    m.audit+=s.audit.length;
    const u=ubrRows(s);if(u.length){m.ubrStu++;m.ubrC+=u.length}
    if(s.otElig){m.otElig++;if(s.onTrack)m.ot++;if(s.startedOff){m.startOff++;if(s.onTrack)m.backOn++;else m.stillOff++}}
  }
  return m;
}

function normId(v){v=String(v||'').toUpperCase().replace(/\s+/g,'');if(!v)return '';return v.startsWith('S-')?v:'S-'+v.replace(/^S/,'')}
function lookupStudent(raw){

  if(!s){S.sp.stu=null;S.sp.msg=`No current student has the number ${id}.`;return}
  if(!stuOk(s)){S.sp.stu=null;S.sp.msg=`${id} is not in the current School, Counselor or Grade filter. Clear the filters and try again.`;return}
  S.sp.stu=id;S.sp.msg='';
}

function reqCheck(s,bk){
  const prog=s.prog,req=PROGRAMS[prog].req[bk];
  const inB=r=>bucketOf(prog,r.type)===bk;
  const done=s.tx.filter(inB).reduce((t,r)=>t+r.earned,0);
  const sch=s.sched.filter(inB).reduce((t,r)=>t+r.schedCr,0);
  const proj=done+sch,left=Math.max(0,req-proj);
  const hasPace=prog!==64&&PACE_COLS.includes(bk);
  const nowExp=hasPace?Math.min(req,paceVal(s,bk,CUR_Q)):null;
  const juneExp=hasPace?Math.min(req,paceVal(s,bk,'4')):null;
  let st,cls;
  if(proj>=req-1e-9){st='Met by the end of this year';cls='ok'}
  else if(s.grade==='12'){st=`Short ${fmtC(left)}: schedule more`;cls='bad'}
  else if(hasPace&&proj<juneExp-1e-9){st=`Behind pace: ${fmtC(juneExp-proj)} short of the June expectation`;cls='warn'}
  else if(hasPace){st=`On pace (${fmtC(left)} left after this year)`;cls='ok'}
  else{st=`${fmtC(left)} left after this year`;cls='ok'}
  const types=REQ_ORDER.filter(t=>bucketOf(prog,t)===bk);
  return {done,sch,req,proj,left,st,cls,nowExp,juneExp,types,belowNow:hasPace&&done<nowExp-1e-9};
}

  const summary=progNote+`<div class="scroll"><table class="tbl"><thead><tr><th>Graduation requirement</th><th>Credit types counted</th><th class="num">Required</th><th class="num">Earned</th><th class="num">Expected now</th><th class="num">Scheduled 2026-27</th><th class="num">Projected (earned + scheduled)</th><th class="num">Expected by June</th><th>Schedule check</th></tr></thead><tbody>${
    BK.map(bk=>{const c=checks[bk];return `<tr><td>${esc(bk)}</td><td style="white-space:normal">${esc(c.types.map(shortT).join(', '))}</td>${mk(fmtC(c.req))}
      ${mk(fmtC(c.done),c.belowNow?CELL.lorange:'',{tip:c.belowNow?tip([['Below the start-of-year expectation',`${fmtC(c.done)} earned, ${fmtC(c.nowExp)} expected`]]):''})}
      ${mk(c.nowExp===null?'':fmtC(c.nowExp))}${mk(fmtC(c.sch))}${mk(fmtC(c.proj))}${mk(c.juneExp===null?'':fmtC(c.juneExp))}${mk(esc(c.st),chkBg(c),{text:1})}</tr>`}).join('')}
    <tr class="total"><td>Grand total</td><td></td>${mk(fmtC(BK.reduce((t,bk)=>t+checks[bk].req,0)))}${mk(fmtC(BK.reduce((t,bk)=>t+checks[bk].done,0)))}${mk(s.prog===64?'':fmtC(paceVal(s,'Total',CUR_Q)))}${mk(fmtC(BK.reduce((t,bk)=>t+checks[bk].sch,0)))}${mk(fmtC(BK.reduce((t,bk)=>t+checks[bk].proj,0)))}${mk(s.prog===64?'':fmtC(paceVal(s,'Total','4')))}<td></td></tr></tbody></table></div>`;
  const body=BK.map(bk=>{
    const inB=r=>bucketOf(s.prog,r.type)===bk;
    const rs=[...s.tx.filter(inB),...s.sched.filter(inB)];if(!rs.length)return '';
    const c=checks[bk];
    const rowsH=rs.map((r,i)=>{
      let note,nbg='';
      if(r.sched){
        if(r.rec){note=`In progress: recovering the ${yl(r.rec.fYear)} F${r.period?' (CreditRec period)':''}`;nbg=CELL.pteal}
        else if(r.ubr){note=`Failing Q1 now (${r.ubr.letter}, ${r.ubr.pctScore}%)${CR_ONLY?'':'. UBR eligible'}`;nbg=CELL.lred}
        else{note='Scheduled';nbg=CELL.lav}
      } else if(r.rec){note=`Recovery for the ${yl(r.rec.fYear)} F`}
      else if(r.f){
        const f=r.f,tabTxt=` CR tab: ${f.tab}.`;
        const map={recOCR:`Recovered: OCR ${yl(f.recYear)}`,summer:`Recovered: Summer ${f.fYear}`,retake:`Recovered: Retake ${yl(f.recYear)}`,same:'Recovered: credit completed the same year',transfer:'Recovered: transfer credit (verify)',ipOCR:'In progress: OCR in the CreditRec period',ipRetake:'In progress: Retake 2026-27'};
        if(map[f.k]){note=map[f.k]+'.'+tabTxt;nbg=f.group==='Recovered'?CELL.lteal:CELL.pteal}
        else{note=(f.k==='partial'?`Partial: ${fmtC(f.earned-f.orig)} of ${fmtC(f.needed-f.orig)} credit recovered (${yl(f.partYear)}). Nothing scheduled for the rest.`:'Nothing scheduled or planned.')+tabTxt;nbg=CELL.red}
      } else if(r.elective&&r.qs.includes('F'))note='Elective (not tracked)';
      else note='';
      const qbg=q=>(q==='F'||q==='U')?CELL.lred:(r.sched&&q?CELL.lav:'');
      const rh=i===0?`<td class="rh" rowspan="${rs.length+1}">${esc(bk)}</td>`:'';
      return `<tr>${rh}<td>${esc(r.sched?'2026-27 (scheduled)':r.ylab)}</td><td>${esc(r.code)}</td><td>${r.rec?'↳ ':''}${esc(r.name)}</td><td>${esc(shortT(r.type))}</td>
        ${r.qs.map(q=>mk(q||'',qbg(q),{text:1})).join('')}${mk(esc(r.other||''),r.sched?CELL.lav:'',{text:1})}${mk(r.sched?'':fmtC(r.earned),r.sched?CELL.lav:'')}${mk(r.sched?fmtC(r.schedCr):'',r.sched?CELL.lav:'')}${mk(esc(note),nbg,{text:1,wrap:260})}</tr>`}).join('');
    return rowsH+`<tr class="sub"><td colspan="4">Total</td><td></td><td></td><td></td><td></td><td></td>${mk(fmtC(c.done))}${mk(fmtC(c.sch))}<td></td></tr>`;
  }).join('');
  return top+`<div class="ws-title">Graduation requirements <span class="note">Expected now = start-of-year pace (Before Q1). Orange = behind pace, red = senior requirement left short</span></div>${summary}
    <div class="ws-title">Courses by graduation requirement <span class="note">Completed and scheduled courses. Q1–Q4 come from the transcript's grading-task code; semester, final, summer and transfer grades go in their own column. ↳ = recovery course. Shading: light red = F, lavender = scheduled this year (Q1 shows the in-progress grade), teal = recovered or in progress, red = nothing scheduled. Synthetic data</span></div>
    <div class="scroll" style="max-height:520px"><table class="tbl pager"><thead><tr><th>Requirement</th><th>Year</th><th>Course #</th><th>Course</th><th>Credit type</th><th class="qc">Q1</th><th class="qc">Q2</th><th class="qc">Q3</th><th class="qc">Q4</th><th>Semester / Final / Other</th><th class="num">Credits earned</th><th class="num">Credits scheduled</th><th>F recovery / notes</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function paneStudent(){
  return globalCards()+'<hr>'+
    `<div class="fcard"><label class="ftitle" for="f-sp-q">Student number</label>
      <div style="display:flex;gap:4px"><input id="f-sp-q" type="text" inputmode="text" autocomplete="off" placeholder="Type a student number" value="${esc(S.sp.q)}" style="flex:1;min-width:0;padding:4px 6px;border:1px solid var(--grid-strong);background:var(--canvas);border-radius:2px">
      <button type="button" ${act(()=>{const el=document.getElementById('f-sp-q');lookupStudent(el?el.value:'')})} style="padding:4px 8px;border:1px solid var(--grid-strong);background:var(--hdr);border-radius:2px;cursor:pointer">Look up</button></div>
      ${S.sp.msg?`<p class="pnote warn" style="margin:4px 0 0">${esc(S.sp.msg)}</p>`:''}</div>`+
    `<p class="pnote">Type the exact student number and press Enter. Counselors usually arrive here from a row on ${CR_ONLY?'':'the Student F List, '}Audit Exceptions or Graduation Off-Track, which fills the number in.</p>`+
    `<div class="fcard legend"><div class="ftitle">Cell color</div>${[['F (completed or now)',CELL.lred],['Scheduled this year',CELL.lav],['Recovered',CELL.lteal],['In progress',CELL.pteal],['Nothing scheduled / senior short',CELL.red],['Behind pace',CELL.lorange]].map(([l,c])=>`<div class="row"><span class="sq" style="background:${c}"></span>${l}</div>`).join('')}</div>`+
    `<p class="pnote">Requirements: the cohort program (Class of 2027, VPHS Class of 2027, Class of 2028 & Beyond, Lotus). Courses fill requirements by their Infinite Campus credit type; types a program doesn't list (Fine Arts, PE, Health, Computer Tech) count as Elective. Pace: CreditRequirementByQuarter2027 with two grade 12 fixes.</p>`;
}

/* ============================ Info panels (show/hide container) ============================ */
const INFO={
 district:[`<h2>About this view</h2><p>District roll-up for the CR coordinator. Every CR-eligible F a current student has ever earned, judged against the transcript.</p><ul><li><b>Every F addressed</b>: a student counts only when all of their CR-eligible F's are recovered or in progress.</li><li><b>Not addressed</b>: partial credit or nothing scheduled.</li><li><b>Lab / CreditRec mismatches</b> are true set differences, not the old net "Discrepancies."</li></ul>`,
   `<h2>Tableau build</h2><ul><li>Five BANs: one sheet each, text marks.</li><li>School table: Measure Names / Measure Values, conditional color via calc on Background.</li><li>Row click: Menu filter actions to ${CR_ONLY?'School Overview and Audit Exceptions':'School Overview, Student F List and Audit Exceptions'} (Show all values on clear).</li><li>Outcome bars: 100% stacked bar, Percent of Total table calc across Status.</li></ul>`],
 school:[`<h2>About this view</h2><p>One school's CR picture for admins and counselors. Pick the school in the School filter.</p><ul><li><b>Outcome by course</b>: CR-eligible F's by status, darker = more F's in that column.</li><li><b>Counselors</b>: caseloads, F's still needing action, and F's never entered on the CR tab.</li></ul>`,
   `<h2>Tableau build</h2><ul><li>Course table: highlight table (Status on Columns, COUNT of F on Color).</li><li>Menu actions: ${CR_ONLY?'counselor → Audit Exceptions (Counselor)':'course → Student F List (Course), counselor → Student F List / Audit (Counselor)'}.</li><li>School filter shared with all dashboards via Selected Worksheets.</li></ul>`],
 flist:[`<h2>About this view</h2><p>The counselor action list: one row per CR-eligible F. The default hides recovered F's; tick Recovered to audit those too.</p><ul><li><b>Credit needed</b> = credits attempted in the year of the first F. <b>Outstanding</b> = needed minus earned.</li><li><b>Next step</b> combines status and the CR tab: schedule OCR or a retake, enter a tab record, or mark the tab Yes.</li></ul>`,
   `<h2>Tableau build</h2><ul><li>Text table at student × course-family grain (from the student-F table in SQL).</li><li>Status color: shape or square marks on Status, or a colored Status column.</li><li>Next step: a CASE calc on Status group, CR tab and HasOCR.</li><li>Tooltip carries F year/quarter detail and CR tab entry year.</li></ul>`],
 ubr:[`<h2>About this view</h2><p>Today's failing grades (F or U) in UBR-eligible courses, so teachers and counselors can issue UBRs before the quarter's grades post. Uses the grades-dashboard rule: posted score, else the in-progress score.</p><ul><li>Submissions and completions arrive in phase 2 (Edgenuity or form data).</li><li>AP and ELD stay included until the CR team decides.</li></ul>`,
   `<h2>Tableau build</h2><ul><li>Include AP / Include ELD: string parameters, each with a calc filter (<code>[Include AP]="Include" OR NOT [IsAP]</code>).</li><li>Teacher card: Only Relevant Values.</li><li>Phase 2 columns: placeholder calcs until the Edgenuity feed exists.</li></ul>`],
 audit:[`<h2>About this view</h2><p>Where the CR tab and the transcript or schedule disagree. The transcript is the source of truth.</p><ul><li>Checks 1–6, A and B belong to the CR coordinator; check 7 (CR-eligible F never entered on the CR tab) and check C (graduation program doesn't match the student's cohort) belong to the counselor.</li><li>Click a cell to see its items below; click again to clear.</li></ul>`,
   `<h2>Tableau build</h2><ul><li>Matrix: highlight table, School × Check, COUNT on Color, per-check color range.</li><li>Cell click: Select filter action on the same dashboard (Single-select only unchecked, Show all values on clear).</li><li>Detail: long table at one row per exception (Check, Detail text built in SQL).</li></ul>`],
 student:[`<h2>About this view</h2><p>One student's completed and currently scheduled courses, grouped by the graduation requirement each one fills. The requirement table at the top adds earned and scheduled credits, so a counselor can see whether this year's schedule keeps each requirement on pace. Red boxes are F's with nothing scheduled, or a senior requirement the schedule leaves short.</p><ul><li>Recovery courses (OCR, summer, retake, transfer) appear as their own indented rows in the year they were taken.</li><li><b>Access:</b> this page shows a whole transcript. Limit it to staff with a legitimate educational interest, ideally with a user filter so counselors see only their caseload.</li></ul>`,
   `<h2>Tableau build</h2><ul><li>Requirement table: credits earned (TranscriptCredit.standardID) + credits scheduled (active-trial roster × GradingTaskCredit.standardID) vs the cohort program's CreditRequirement rows; pace from CreditRequirementByQuarter2027.</li><li>Course sheet: Requirement, Year, Course # and Course on Rows; Quarter on Columns; ATTR(Score) on Text. Credits earned and F recovery as additional text columns.</li><li>Both tables are highlight tables built from long-format SQL output (one row per cell), so each cell can get its own background from one Cell Color calc. Label color is one fixed color for the whole sheet.</li><li>Q1–Q4 = TranscriptCourse.gradingTaskCode. S1/S2, Final, SS and blank codes (transfer credit, labeled with TranscriptCourse.schoolName) are one text cell built in SQL.</li><li>Requirement subtotals: Analysis → Totals → Add all subtotals. Program line: a calc in the worksheet title.</li><li>Student number box: a type-in string parameter with a calc filter ([Student Number] = [Student Number Parameter]). Menu actions on other tabs use a Parameter Action to fill it in.</li><li>Reached from Menu actions on ${CR_ONLY?'':'the Student F List, '}Audit and Off-Track rows. Users can print it with Download → PDF.</li></ul>`],
 ontrack:[`<h2>About this view</h2><p>Only students in grades 10–12 who are behind on total credits. On-track students never appear.</p><ul><li><b>Off track</b> = credits earned now is below the expected total for the student's grade and the current quarter.</li><li><b>Credits expected now</b> = the Total column of <code>CreditRequirementByQuarter2027</code>, Before Q1 row (Q1 row once Q1 grades post). Vista PEAK has its own rows; Avenues, Vanguard and Lotus use the district rows.</li><li><b>Off track at start of year</b> compares transcript credits on the first day of school with the same Before Q1 row.</li></ul>`,
   `<h2>Tableau build</h2><ul><li>Data source filter: [Credits earned now] &lt; [Credits expected now], so on-track students never load.</li><li>Grid: bar chart, Grade on Columns, School on Rows, COUNT and % off track as labels.</li><li>Click: Select filter action to the student list.</li><li>Credits short and CR-eligible F's not scheduled: highlight-table cells with a banded Cell Color calc.</li></ul>`]
};

/* ============================ Render ============================ */
const VIEWS={district:[rDistrict,()=>globalCards()+'<hr>'+legend()],school:[rSchool,()=>globalCards()+'<hr>'+legend()],flist:[rFList,paneFList],ubr:[rUBR,paneUBR],audit:[rAudit,paneAudit],ontrack:[rOnTrack,paneOnTrack],student:[rStudent,paneStudent]};
function render(){
  TIPS=[];ACTS=[];MENUS=[];hideTip();hideMenu();
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.tab===k}" ${act(()=>{S.tab=k})}>${esc(l)}</button>`).join('');
  const title=TABS.find(t=>t[0]===S.tab)[1];
  const scope=[S.school==='(All)'?'All schools':S.school,S.counselor!=='(All)'?'Counselor: '+S.counselor:'',S.grade!=='(All)'?'Grade '+S.grade:''].filter(Boolean).join(', ');
  document.getElementById('banner').innerHTML=`<div><h1>Credit Recovery: ${esc(title)}</h1><div class="sub">${esc(scope)}. 2026-27, Q1 week 7. Data as of ${AS_OF}, refreshed daily from Infinite Campus.</div></div>
    <div class="right"><button class="bbtn" aria-expanded="${S.info}" ${act(()=>{S.info=!S.info})}>ⓘ About this view</button><button class="bbtn reset" ${act(()=>{const t=S.tab;S=defaults();S.tab=t})}>Reset all filters</button></div>`;
  const [rv,rp]=VIEWS[S.tab];
  document.getElementById('main').innerHTML=rv();
  document.getElementById('pane').innerHTML=rp();
  const inf=INFO[S.tab];
  document.getElementById('infoHost').innerHTML=S.info?`<div class="info" role="dialog" aria-label="About this view"><button class="close" aria-label="Close" ${act(()=>{S.info=false})}>✕</button><div>${inf[0]}</div><div>${inf[1]}</div></div>`:'';
}

/* ============================ Events ============================ */
const tipEl=document.getElementById('tip'),menuEl=document.getElementById('menu');
function linesHTML(lines){return lines.map(([k,v])=>`<div class="ln"><span>${esc(k)}:</span> <b>${esc(v)}</b></div>`).join('')}
function place(el,x,y){const w=el.offsetWidth,h=el.offsetHeight;let L=x+14,T=y+14;if(L+w>innerWidth-8)L=x-w-14;if(T+h>innerHeight-8)T=y-h-14;el.style.left=Math.max(4,L)+'px';el.style.top=Math.max(4,T)+'px'}
function hideTip(){if(tipEl)tipEl.style.display='none'}
function hideMenu(){if(menuEl)menuEl.style.display='none'}
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t||menuEl.style.display==='block'){return}tipEl.innerHTML=linesHTML(TIPS[+t.dataset.tip]);tipEl.style.display='block';place(tipEl,e.clientX,e.clientY)});
document.addEventListener('mousemove',e=>{if(tipEl.style.display==='block'){if(!e.target.closest('[data-tip]'))hideTip();else place(tipEl,e.clientX,e.clientY)}});
function openMenu(m,x,y){
  hideTip();
  menuEl.innerHTML=linesHTML(m.lines)+`<div class="acts">${m.actions.map(([l],i)=>`<button data-mi="${i}">${esc(l)}</button>`).join('')}</div>`;
  menuEl.style.display='block';place(menuEl,x,y);
  menuEl.onclick=ev=>{const b=ev.target.closest('[data-mi]');if(!b)return;m.actions[+b.dataset.mi][1]();hideMenu();render()};
  const first=menuEl.querySelector('button');if(first)first.focus();
}
document.addEventListener('click',e=>{
  if(e.target.closest('#menu'))return;
  const a=e.target.closest('[data-act]');
  if(a){if(a.tagName==='A')e.preventDefault();ACTS[+a.dataset.act]();render();return}
  const m=e.target.closest('[data-menu]');
  if(m){openMenu(MENUS[+m.dataset.menu],e.clientX,e.clientY);return}
  hideMenu();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='f-sp-q'){lookupStudent(e.target.value);render();const el=document.getElementById('f-sp-q');if(el)el.focus();return}
  if(e.key==='Escape'){hideMenu();if(S.info){S.info=false;render()}return}
  if(e.key==='Enter'){const m=e.target.closest&&e.target.closest('tr[data-menu]');if(m){const r=m.getBoundingClientRect();openMenu(MENUS[+m.dataset.menu],r.left+40,r.top+10)}}
});
function setPath(path,val){const p=path.split('.');if(p.length===1)S[p[0]]=val;else S[p[0]][p[1]]=val}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f){
    setPath(t.dataset.f,t.value);
    if(t.dataset.f==='school'){const sc=schoolByName(S.school);if(sc&&!sc.counselors.includes(S.counselor))S.counselor='(All)';S.au.sid=null;S.ot.sid=null;S.ot.g=null}
    if(t.dataset.f==='fl.subject')S.fl.course='(All)';
    render();
  } else if(t.dataset.fc){
    const set=S.fl.status;t.checked?set.add(t.value):set.delete(t.value);render();
  }
});
render();
</script>
</body>
</html>
